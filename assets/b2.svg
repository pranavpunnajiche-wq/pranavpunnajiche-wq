<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<clipPath id="c"><rect width="560" height="260" rx="14"/></clipPath>
<clipPath id="wing"><polygon points="0,-30 90,18 80,22 62,17 46,25 30,19 15,27 0,21 -15,27 -30,19 -46,25 -62,17 -80,22 -90,18"/></clipPath>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset="1" stop-color="#00ff41" stop-opacity="0.95"/></linearGradient>
<style>
.m{font-family:'Courier New',Courier,monospace;fill:#00ff41}
.d{font-family:'Courier New',Courier,monospace;fill:#00a82b;letter-spacing:1px;font-size:10px}
</style>
</defs>
<g clip-path="url(#c)">
<rect width="560" height="260" fill="#000"/>
<g stroke="#00ff41" stroke-opacity="0.07"><path d="M0 70H560M0 100H560M0 130H560M0 160H560M0 190H560M0 220H560"/></g>
<!-- corner brackets -->
<g stroke="#00ff41" stroke-width="2" fill="none">
  <path d="M14 34V14H34M526 14H546V34M14 226V246H34M526 246H546V226"/>
</g>
<text x="30" y="40" class="m" font-size="17" font-weight="bold">&gt; B-2_SPIRIT</text>
<text x="30" y="55" class="d">STEALTH BOMBER // LOW-OBSERVABLE SCAN</text>
<!-- wing scan -->
<g transform="translate(175,145) scale(1.5)">
  <polygon points="0,-30 90,18 80,22 62,17 46,25 30,19 15,27 0,21 -15,27 -30,19 -46,25 -62,17 -80,22 -90,18" fill="#00ff41" fill-opacity="0.05" stroke="#00ff41" stroke-opacity="0.7" stroke-width="0.8" stroke-dasharray="3 2"/>
  <g clip-path="url(#wing)">
    <rect y="-40" width="50" height="80" fill="url(#beam)">
      <animate attributeName="x" values="-140;100" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect y="-40" width="2" height="80" fill="#00ff41">
      <animate attributeName="x" values="-90;150" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>
<!-- scan label -->
<text x="30" y="214" class="d">SCANNING AIRFRAME...</text>
<rect x="30" y="220" width="250" height="4" fill="none" stroke="#00ff41" stroke-opacity="0.6"/>
<rect x="31" y="221" width="10" height="2" fill="#00ff41"><animate attributeName="width" values="0;248;0" dur="3s" repeatCount="indefinite"/></rect>
<!-- RCS panel -->
<line x1="320" y1="68" x2="320" y2="226" stroke="#00ff41" stroke-opacity="0.4"/>
<text x="338" y="82" class="d">// RADAR CROSS-SECTION</text>
<g fill="#00ff41">
  <rect x="338" y="94" width="16" height="30"><animate attributeName="y" values="108;96;108" dur="2.1s" repeatCount="indefinite"/><animate attributeName="height" values="16;28;16" dur="2.1s" repeatCount="indefinite"/></rect>
  <rect x="362" y="104" width="16" height="20"><animate attributeName="y" values="112;102;112" dur="1.7s" repeatCount="indefinite"/><animate attributeName="height" values="12;22;12" dur="1.7s" repeatCount="indefinite"/></rect>
  <rect x="386" y="110" width="16" height="14"><animate attributeName="y" values="116;108;116" dur="2.5s" repeatCount="indefinite"/><animate attributeName="height" values="8;16;8" dur="2.5s" repeatCount="indefinite"/></rect>
  <rect x="410" y="106" width="16" height="18"><animate attributeName="y" values="110;100;110" dur="1.9s" repeatCount="indefinite"/><animate attributeName="height" values="14;24;14" dur="1.9s" repeatCount="indefinite"/></rect>
  <rect x="434" y="114" width="16" height="10"><animate attributeName="y" values="118;110;118" dur="2.3s" repeatCount="indefinite"/><animate attributeName="height" values="6;14;6" dur="2.3s" repeatCount="indefinite"/></rect>
  <rect x="458" y="108" width="16" height="16"><animate attributeName="y" values="114;104;114" dur="1.5s" repeatCount="indefinite"/><animate attributeName="height" values="10;20;10" dur="1.5s" repeatCount="indefinite"/></rect>
  <rect x="482" y="116" width="16" height="8"><animate attributeName="y" values="120;112;120" dur="2.7s" repeatCount="indefinite"/><animate attributeName="height" values="4;12;4" dur="2.7s" repeatCount="indefinite"/></rect>
</g>
<line x1="334" y1="124" x2="504" y2="124" stroke="#00ff41"/>
<text x="338" y="140" class="d">SIGNATURE: MINIMAL</text>
<g class="m" font-size="12">
  <text x="338" y="166"><tspan fill="#00a82b">ROLE   </tspan>Stealth bomber</text>
  <text x="338" y="184"><tspan fill="#00a82b">CONFIG </tspan>Flying wing</text>
  <text x="338" y="202"><tspan fill="#00a82b">DESIGN </tspan>Low-observable</text>
  <text x="338" y="220"><tspan fill="#00a82b">SYSTEM </tspan>ONLINE<animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></text>
</g>
</g>
<rect x="0.5" y="0.5" width="559" height="259" rx="14" fill="none" stroke="#00ff41" stroke-opacity="0.7"/>
</svg>
